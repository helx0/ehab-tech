    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffd166"/><stop offset="1" stop-color="#42d6a4"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
